<div class="top-section">
    <div class="date-line"> <!-- <          DATE             > -->
        <span class="left-arrow" (click)="getRidesForDate('previousDay')">&lt;</span>
        <span class="date">{{ currentDate | date: 'mediumDate'}}</span>
        <span
            class="right-arrow" 
            (click)="getRidesForDate('nextDay')"
            [style.visibility] = "isToday() ? 'hidden' : 'visible'">
            &gt;
        </span> 
    </div>
    <!--<p class="total">Spent £{{ totalExpense | number: '1.2-2'}}</p>-->
</div>

@for (ride of rides; track ride.id) {
    <div class="expense-card">
        <!-- <span class="icon">{{ ride.categoryIcon }}</span> -->
        <div class="ride-details">
            <span class="name">{{ ride.name }}</span>
            <span>{{ ride.description }}</span>
        </div>
    </div>
}
